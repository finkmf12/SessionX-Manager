name: Session X - Criar cargos neon

on:
  workflow_dispatch:
    inputs:
      guild_id:
        description: 'ID numérico do servidor Session X'
        required: true
        default: '1571678876961607681'
        type: string
      mode:
        description: 'preview apenas simula; apply cria os cargos'
        required: true
        type: choice
        options:
          - preview
          - apply
        default: preview
      confirmation:
        description: 'Digite APLICAR_CARGOS somente para criar os cargos'
        required: false
        type: string

jobs:
  roles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Criar cargos
        env:
          MICUP_TOKEN: ${{ secrets.MICUP_TOKEN }}
          MICUP_GUILD_ID: ${{ inputs.guild_id }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirmation }}
        run: node scripts/create-roles.js
