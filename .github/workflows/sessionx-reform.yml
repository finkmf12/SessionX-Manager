name: Session X - Reforma da comunidade

on:
  workflow_dispatch:
    inputs:
      guild_id:
        description: 'ID numérico do servidor Session X'
        required: true
        type: string
      mode:
        description: 'preview apenas simula; apply executa as mudanças'
        required: true
        type: choice
        options:
          - preview
          - apply
        default: preview
      confirmation:
        description: 'Digite APLICAR somente para executar a reforma'
        required: false
        type: string

jobs:
  reform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Executar reforma
        env:
          MICUP_TOKEN: ${{ secrets.MICUP_TOKEN }}
          MICUP_GUILD_ID: ${{ inputs.guild_id }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirmation }}
        run: node scripts/reform.js
